[package]
name = "eip-0045-candidate-generator"
description = "Non-final candidate RISC Zero proof generator for EIP-0045 reproduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
authors = ["A. Shannon"]
publish = false
build = false

[workspace]
resolver = "3"

[features]
default = ["embedded-method"]
b4-campaign-executor = [
    "b4-authoritative-build-custody",
    "dep:crc32fast",
    "dep:eip0045-h0-contract",
    "dep:eip0045-h0-linux-abi",
    "dep:flate2",
    "eip-0045-reproduction/b4-terminal-evidence-packet",
    "eip-0045-reproduction/positive-gate",
]
b4-authoritative-build-custody = [
    "eip-0045-reproduction/b4-descriptor-build-check",
]
b4-prepare-input-set-kernel = [
    "b4-campaign-executor",
    "eip-0045-reproduction/positive-gate",
]
b4-finalize-generation-set-handler = [
    "b4-campaign-executor",
    "eip-0045-reproduction/positive-gate",
]
b4-terminal-fixture-generation = [
    "proof-generation",
    "eip-0045-reproduction/receipt-oracle",
]
b4-terminal-source-lineage = [
    "b4-terminal-fixture-generation",
    "eip-0045-reproduction/positive-gate",
]
b4-terminal-evidence-export = [
    "b4-terminal-source-lineage",
    "eip-0045-reproduction/b4-terminal-evidence-publication",
]
b4-negative-ancestry-finalization = [
    "proof-generation",
    "eip-0045-reproduction/positive-gate",
    "eip-0045-reproduction/receipt-oracle",
]
b4-negative-ancestry-publication = [
    "b4-negative-ancestry-finalization",
    "eip-0045-reproduction/negative-ancestry-publication",
]
b4-negative-ancestry-handler = [
    "b4-campaign-executor",
    "b4-negative-ancestry-publication",
    "b4-terminal-evidence-export",
    "embedded-method",
]
b4-negative-materialization-handler = [
    "b4-campaign-executor",
    "embedded-method",
    "eip-0045-reproduction/negative-materialization-set",
]
embedded-method = ["eip-0045-methods/embed-methods", "proof-generation"]
proof-generation = ["risc0-zkvm/prove"]

[[bin]]
name = "eip-0045-candidate-generator"
path = "src/main.rs"
required-features = ["embedded-method"]

[[bin]]
name = "eip-0045-profile"
path = "src/bin/eip-0045-profile.rs"

[[bin]]
name = "eip-0045-ancestry-pair"
path = "src/bin/eip-0045-ancestry-pair.rs"

[[bin]]
name = "eip-0045-root-gate"
path = "src/bin/eip-0045-root-gate.rs"
required-features = ["proof-generation"]

[dependencies]
anyhow = "=1.0.99"
bincode = "=1.3.3"
borsh = { version = "=1.5.7", features = ["derive"] }
clap = { version = "=4.5.46", features = ["derive"] }
crc32fast = { version = "=1.5.0", optional = true }
eip-0045-methods = { path = "../methods", default-features = false }
eip-0045-reproduction = { path = "../reproduction", default-features = false, features = ["profile", "receipt-oracle-codec", "recursive-ancestry"] }
eip0045-h0-contract = { version = "=0.1.0", path = "../appliance/h0-tmpfs-provider/crates/contract", default-features = false, optional = true }
elf = { version = "=0.7.4", default-features = false }
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"], optional = true }
hex = "=0.4.3"
renamore = "=0.3.2"
risc0-binfmt = { git = "https://github.com/a-shannon/risc0", rev = "227229dc793c215c533cbc0e07911601974a4629", default-features = false, features = ["std"] }
risc0-core = { git = "https://github.com/a-shannon/risc0", rev = "227229dc793c215c533cbc0e07911601974a4629", default-features = false }
risc0-zkp = { git = "https://github.com/a-shannon/risc0", rev = "227229dc793c215c533cbc0e07911601974a4629", default-features = false }
risc0-zkvm = { git = "https://github.com/a-shannon/risc0", rev = "227229dc793c215c533cbc0e07911601974a4629", default-features = false, features = ["disable-dev-mode"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
eip0045-h0-linux-abi = { version = "=0.1.0", path = "../appliance/h0-tmpfs-provider/crates/linux-abi", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[dev-dependencies]
quote = "=1.0.40"
syn = { version = "=2.0.106", features = ["extra-traits", "full", "visit"] }
tempfile = "=3.27.0"
toml = "=0.8.23"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
