name: Non-proving checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive grammar and canonical output fixtures
        run: |
          python3 --version
          timeout --signal=TERM --kill-after=2s 120s python3 -B reproduction/jvm-artifact/test_canonical_zip.py reproduction/jvm-artifact/canonical_zip.py ed0d57c5fc507b4283f317838ff524e2aa05c8364f578f317cdccfb7c87e9f66 "$RUNNER_TEMP/archive-grammar"
      - name: Isolated archive guard mutants
        run: |
          timeout --signal=TERM --kill-after=2s 120s python3 -B reproduction/jvm-artifact/test_canonical_zip.py reproduction/jvm-artifact/canonical_zip.py ed0d57c5fc507b4283f317838ff524e2aa05c8364f578f317cdccfb7c87e9f66 "$RUNNER_TEMP/archive-mutants" mutants

  libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set temporary build output
        run: printf 'CARGO_TARGET_DIR=%s/eip0045-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned host Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Fetch locked guest metadata dependencies
        run: cargo +1.89.0 fetch --manifest-path methods/guest/Cargo.toml --locked
      - name: Guest ABI and build-contract tests
        run: cargo +1.89.0 test --manifest-path methods/Cargo.toml --no-default-features --locked
      - name: Reproduction library and profile tests
        run: cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features profile --lib --tests --locked
      - name: Positive input-set assembly and authority tests
        run: |
          cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features positive-gate --lib v2_input_set_assembler_ --locked
          cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features positive-gate --lib v2_positive_precommit_gate_ --locked
          cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features positive-gate --lib v2_precommit_authorities_have_no_v1_conversion_or_constructible_surface --locked
          cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features positive-gate --doc B4PositivePrecommitAuthorityV2 --locked
      - name: Non-proving generator library tests
        run: cargo +1.89.0 test --manifest-path generator/Cargo.toml --no-default-features --lib --locked
      - name: Trusted-host request and completion binding tests
        run: cargo +1.89.0 test --manifest-path reproduction/Cargo.toml --no-default-features --features positive-gate --lib trusted_host --locked

  windows-build-runner:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve producer work directories
        shell: powershell
        run: |
          & ./reproduction/b4-build/test-keep-transient.ps1 -ResultRoot (Join-Path $env:RUNNER_TEMP 'b4-keep-transient')
