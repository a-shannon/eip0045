[package]
name = "ergo310-receipt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bincode = "=1.3.3"
eip-0045-methods = { path = "../abi" }
hex = "0.4"
risc0-binfmt = { version = "=3.0.6", default-features = false }
risc0-zkos-v1compat = "=2.2.3"
risc0-zkp = { version = "=3.0.6", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
